# Sitemap - ensure XML is served (static file takes precedence; this is a fallback)
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Operational routes are client-rendered because they depend on query or
# navigation state. Keep them out of search results at the HTTP layer too.
[[headers]]
  for = "/confirm"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/order-confirmation"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/reviews"
  [headers.values]
    X-Robots-Tag = "noindex, follow"
[[headers]]
  for = "/reviews/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

