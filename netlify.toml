  status = 200
  force = true

# Unknown routes must return a real HTTP 404. Every public route is
# prerendered, so valid documents are served before this final fallback.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdnwidget.judge.me 'unsafe-inline' 'unsafe-eval' data: https://www.googletagmanager.com https://www.google-analytics.com https://widget.reputationhub.com.au https://www.fresha.com https://www.clarity.ms https://*.clarity.ms https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://challenges.cloudflare.com; style-src https://cdnwidget.judge.me 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; style-src-elem https://cdnwidget.judge.me 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net; font-src https://cdnwidget.judge.me 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; img-src https://judgeme.imgix.net https://cdnwidget.judge.me 'self' data: blob: https://cdn.shopify.com https://*.googleusercontent.com https://maps.googleapis.com https://maps.gstatic.com https://www.google.com https://www.google-analytics.com https://widget.reputationhub.com.au https://*.clarity.ms https://assets.cdn.filesafe.space https://*.filesafe.space https://c.bing.com; frame-src https://www.fresha.com https://www.google.com https://maps.google.com https://widget.reputationhub.com.au https://www.google.com/recaptcha/ https://challenges.cloudflare.com; connect-src https://cache.judge.me https://api.judge.me https://judge.me 'self' https://*.myshopify.com https://www.google-analytics.com https://www.googletagmanager.com https://widget.reputationhub.com.au https://www.clarity.ms https://*.clarity.ms https://*.filesafe.space https://www.google.com; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:"

# Service worker must never be cached — browsers should always fetch the
# latest version so the kill-switch SW reaches users on next page load.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Cache fonts
[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers for API routes (if using Netlify Functions)
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# Environment Variables Documentation
# Set these in Netlify Dashboard → Site Settings → Environment Variables
# Required for checkout function:
#   - SHOPIFY_MYSHOPIFY_DOMAIN: Your Shopify store domain (e.g., femtat-zu.myshopify.com)
#   - SF_STOREFRONT_TOKEN: Your Shopify Storefront API access token
#   - SF_API_VERSION: Shopify API version (e.g., 2026-07)
# Required for signed Shopify catalogue rebuilds:
#   - SHOPIFY_CATALOG_WEBHOOK_SECRET: Shopify webhook signing secret
#   - NETLIFY_CATALOG_BUILD_HOOK_URL: Secret production build-hook URL
#   - SHOPIFY_CATALOG_BUILD_DELAY_MS: Optional propagation delay (default 60000)
#   - SHOPIFY_CATALOG_BUILD_COOLDOWN_MS: Optional coalescing window (default 300000)
#   - SHOPIFY_CATALOG_WORKER_LEASE_MS: Optional durable worker lease (default 840000)
#   - SHOPIFY_CATALOG_MAX_BUILDS_PER_RUN: Optional trailing-build cap (default 3)
# Optional:
#   - VITE_SHOP_DOMAIN: Your shop domain (e.g., hairpinns.com)
