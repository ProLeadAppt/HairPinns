# Netlify configuration for Hair Pinns

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[functions]
  directory = "netlify/functions"

# Shopify catalogue webhooks invoke this asynchronously. The function verifies
# Shopify's HMAC, waits briefly for Storefront propagation, then queues one
# fresh static catalogue build.
[functions.shopify-catalog-sync-background]
  background = true

# Recover links already sent in the Christmas email. Keep campaign queries.
[[redirects]]
  from = "/products/juuce-christmas-packs"
  to = "/products/christmas-packs/"
  status = 301
  force = true

[[redirects]]
  from = "/products/juuce-christmas-packs/"
  to = "/products/christmas-packs/"
  status = 301
  force = true

# Shopify Messaging uses the primary domain for unsubscribe links. Route only
# those token-bearing URLs to Shopify, which processes the opt-out.
[[redirects]]
  from = "/account/unsubscribe"
  to = "https://femtat-zu.myshopify.com/account/unsubscribe"
  status = 302
  force = true

[[redirects]]
  from = "/account/unsubscribe/*"
  to = "https://femtat-zu.myshopify.com/account/unsubscribe/:splat"
  status = 302
  force = true

# API route first so /api/checkout always hits the function (not the SPA)
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/shopify-catalog-sync"
  to = "/.netlify/functions/shopify-catalog-sync-background"
  status = 200
  force = true

# Cart/checkout - proxy to Shopify (must be before SPA catch-all)
[[redirects]]
  from = "/cart/c/*"
  to = "https://femtat-zu.myshopify.com/cart/c/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cart"
  to = "https://femtat-zu.myshopify.com/cart"
  status = 200
  force = true

# Discount links - redirect to Shopify so discount cookie gets set (must be before SPA catch-all)
[[redirects]]
  from = "/discount/*"
  to = "https://femtat-zu.myshopify.com/discount/:splat"
  status = 302
  force = true

