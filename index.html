<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NOTE: Page-specific title, description, og:*, twitter:*, and canonical tags are set by SEOHead component on each page -->
    <!-- NOTE: Do NOT add them here as they will duplicate page-level tags and confuse search engines -->
    <meta name="author" content="Hair Pinns Salon" />
    <meta name="theme-color" content="#753D91" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Critical images are prioritised by each route's actual LCP element.
         A global hero preload wastes bandwidth on product and article pages. -->
    <link rel="preload" as="font" href="/src/assets/fonts/inter-latin.woff2" type="font/woff2" crossorigin>
    <link rel="preload" as="font" href="/src/assets/fonts/playfair-display-latin.woff2" type="font/woff2" crossorigin>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/hair-pinns-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/hair-pinns-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/hair-pinns-180.png">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="https://hairpinns.com/sitemap.xml">
    <!--
      LLM / AI-crawler discovery.
      Three aliases (all serve text/plain, the full 22 KB context file):
        - /llm.txt     — what most blog posts & tooling reference
        - /llms.txt    — the llms.txt standard (Answer.AI), used by GPTBot/ClaudeBot/Perplexity
        - /llms-full.txt — the same file, named explicitly for the long-form version
      Pointing crawlers at the full version means a single fetch gives an
      LLM the brand, services, products, prices, service areas, FAQs, and
      a curated 10-post blog index — no follow-up crawl needed to cite us.
    -->
    <link rel="alternate" type="text/plain" href="/llms-full.txt" title="Hair Pinns — full context for AI systems" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="Hair Pinns — concise AI index (llms.txt standard)" />
    <link rel="alternate" type="text/plain" href="/llm.txt" title="Hair Pinns — full context for AI systems (alias)" />

    <!-- Keep the GA queue available immediately. The 160 KB provider script is
         loaded after idle by TrackingScripts so it cannot compete with LCP. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-N6Y1TJMWGG');
    </script>

  </head>

  <body>
    <form name="hair-pinns-contact" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="hair-pinns-contact" />
      <input name="company" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="topic" />
      <textarea name="message"></textarea>
      <input name="marketing_consent" />
      <input name="source_page" />
      <input name="form_context" />
    </form>
    <form name="hair-pinns-review-feedback" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="hidden" name="form-name" value="hair-pinns-review-feedback" />
      <input name="company" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="feedback"></textarea>
      <input name="rating" />
      <input name="source_page" />
    </form>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
